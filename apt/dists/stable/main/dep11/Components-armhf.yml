Type: desktop-application
ID: com.knowreva.PairDesk
Package: pairdesk
ProjectLicense: MIT
Name:
  C: PairDesk
Summary:
  C: Use another computer's desktop with your USB devices
Description:
  C: |-
    <p>PairDesk lets you use another Linux computer on your network as if you were sitting at it: its full
    desktop with sound, microphone and clipboard, plus your own USB devices and folders.</p>
    <ul>
      <li>Use a security key (such as a YubiKey), webcam or USB drive plugged into the computer you sit at
      on the remote computer, or the other way round</li>
      <li>Shared folders in both directions</li>
      <li>Pairing with a one-time code: no passwords sent, nobody in between can take part</li>
      <li>Its own encrypted connection on its own port, open only while remote access is on</li>
      <li>Reconnects by itself after a Wi-Fi drop and puts devices and folders back</li>
      <li>Finds computers on your network; a plain IP address is enough</li>
      <li>Sets up the other computer over SSH if needed, even without its screen</li>
      <li>Add-ons are installed only when first needed, after explaining what they are for, and removed cleanly</li>
    </ul>
    <p>PairDesk is a KnowReva project.</p>
